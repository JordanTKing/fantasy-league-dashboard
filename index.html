<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Dashboard — Live</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --field:#16261c; --field-line:#223626;
    --paper:#f6f1e4; --paper-dim:#eee6d2;
    --ink:#1c1a14; --ink-soft:#6b6558;
    --brass:#c9a24b; --brass-deep:#a9822f;
    --good:#3f7d54; --warn:#c9a24b; --over:#b3402f;
    --line:#dcd2b4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: repeating-linear-gradient(90deg, var(--field-line) 0 2px, transparent 2px 64px), var(--field);
    font-family:'Inter',sans-serif; color:var(--ink); min-height:100vh;
    display:flex; justify-content:center;
    padding:20px 14px 92px;
  }
  .app{ width:100%; max-width:460px; }

  .status{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 4px 12px; color:#cfd8ce; font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.04em;
  }
  .status .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  .dot.ok{ background:#5fd88a; box-shadow:0 0 0 3px rgba(95,216,138,.18); }
  .dot.pending{ background:#c9a24b; box-shadow:0 0 0 3px rgba(201,162,75,.18); animation:pulse 1.2s infinite; }
  .dot.err{ background:#e05c48; box-shadow:0 0 0 3px rgba(224,92,72,.18); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }

  .team-picker{ margin-bottom:12px; display:flex; gap:8px; }
  .team-picker select{
    flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); font-family:'Inter',sans-serif; font-size:13.5px; color:var(--ink);
  }
  .commish-pill{
    flex:none; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:11px;
    color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .commish-pill svg{ width:17px; height:17px; display:block; }
  .commish-pill.active{ background:var(--brass); color:#3b2c0e; border-color:var(--brass); }

  .card{
    background:var(--paper); border-radius:18px;
    box-shadow:0 24px 48px -18px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.4) inset;
    overflow:hidden; border:1px solid rgba(0,0,0,.06);
    margin-bottom:14px;
  }
  .card-head{ padding:20px 22px 14px; border-bottom:1px dashed var(--line); }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--brass-deep); margin:0 0 5px;
  }
  h1{
    font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:26px;
    line-height:1.05; letter-spacing:.01em; margin:0; text-transform:uppercase;
    min-height:30px;
  }
  .subtext{ font-size:12px; color:var(--ink-soft); margin:6px 0 0; line-height:1.5; }

  .toggle-row{ display:flex; gap:6px; padding:12px 22px 0; }
  .toggle-btn{
    flex:1; padding:8px 8px; border-radius:8px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:.03em; cursor:pointer; text-transform:uppercase;
  }
  .toggle-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .toggle-btn.active.good{ background:var(--good); border-color:var(--good); }
  .toggle-btn.active.over{ background:var(--over); border-color:var(--over); }

  .underline-tabs{ display:flex; gap:6px; padding:12px 22px 0; border-bottom:1px solid var(--line); }
  .u-tab{
    flex:1; padding:8px 6px; border:none; background:none; cursor:pointer;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
    color:var(--ink-soft); border-bottom:2.5px solid transparent; margin-bottom:-1px;
  }
  .u-tab.active{ color:var(--ink); border-bottom-color:var(--brass); }

  .gauge-wrap{ display:flex; align-items:center; gap:18px; padding:20px 22px; border-bottom:1px dashed var(--line); }
  .gauge{ position:relative; width:104px; height:104px; flex:none; }
  .gauge svg{ transform:rotate(-90deg); }
  .gauge-num{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gauge-num .pct{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:23px; line-height:1; }
  .gauge-num .lbl{ font-family:'IBM Plex Mono',monospace; font-size:8.5px; letter-spacing:.08em; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; }
  .cap-figures{ flex:1; }
  .cap-row{ display:flex; justify-content:space-between; align-items:baseline; padding:4px 0; }
  .cap-row .k{ font-size:12px; color:var(--ink-soft); }
  .cap-row .v{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; }
  .cap-row .v.accent{ color:var(--good); }
  .cap-row .v.over{ color:var(--over); }
  .cap-divider{ height:1px; background:var(--line); margin:2px 0; }

  .cap-summary{
    padding:16px 22px; display:flex; gap:14px; align-items:center;
    border-bottom:1px dashed var(--line);
  }
  .cap-block{ flex:1; text-align:center; }
  .cap-block .lbl{ font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); }
  .cap-block .val{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:20px; margin-top:2px; }
  .cap-block .val.good{ color:var(--good); }
  .cap-block .val.over{ color:var(--over); }
  .cap-arrow{ font-size:18px; color:var(--ink-soft); flex:none; }

  .pos{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:10.5px;
    width:28px; height:28px; border-radius:7px; color:var(--paper);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .pos.pos-QB{ background:#5b7a9c; } .pos.pos-RB{ background:#6f8f5a; }
  .pos.pos-WR{ background:#b06a3f; } .pos.pos-TE{ background:#8a6a9c; }
  .pos.pos-K{ background:#4f9c94; } .pos.pos-DST{ background:#8a7a5a; }
  .pos.pos-other{ background:var(--field); }

  .list{ padding:6px 10px 8px; min-height:60px; }
  .row{ display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:10px; }
  .row:hover{ background:var(--paper-dim); }
  .row.selected{
    background:rgba(201,162,75,.24); border:2px solid var(--brass);
    box-shadow:0 0 0 3px rgba(201,162,75,.12);
  }
  .row.selected .rname .n{ font-weight:800; }
  .row.selected .check-badge{
    flex:none; width:20px; height:20px; border-radius:50%; background:var(--brass);
    color:#3b2c0e; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800;
  }
  .row.is-exempt{ background:rgba(201,162,75,.12); }
  .row.mine{ background:rgba(201,162,75,.14); }
  .row.removing{ background:rgba(179,64,47,.1); text-decoration:line-through; opacity:.7; }
  .row.adding{ background:rgba(63,125,84,.1); }
  .row.clickable{ cursor:pointer; }
  .rname{ flex:1; min-width:0; }
  .rname .n{ font-weight:600; font-size:14px; }
  .rname .t{ font-size:11px; color:var(--ink-soft); }
  .rsal{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px; flex:none; }
  .tag{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:8.5px;
    letter-spacing:.04em; text-transform:uppercase; padding:1.5px 5px; border-radius:5px;
    margin-left:5px; vertical-align:middle;
  }
  .tag.rookie{ background:var(--good); color:#fff; }
  .tag.exempt{ background:var(--brass); color:#3b2c0e; }
  .tag.you{ background:none; color:var(--brass-deep); padding-left:0; }
  .tag.over{ background:var(--over); color:#fff; }
  .tag.team{
    background:var(--paper-dim); color:var(--ink-soft); border:1px solid var(--line);
    font-weight:500; margin-left:0;
  }
  .tag.team.fa{ font-style:italic; }
  .action-icon{ flex:none; font-size:15px; width:18px; text-align:center; }
  .action-icon.remove{ color:var(--over); }
  .action-icon.add{ color:var(--good); }

  .bar-bg{ height:5px; border-radius:3px; background:var(--line); margin-top:5px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:3px; }

  .placeholder{ padding:26px 12px; text-align:center; color:var(--ink-soft); font-size:13px; }
  .all-clear{ padding:28px 12px; text-align:center; color:var(--good); }
  .all-clear .big{ font-size:28px; margin-bottom:6px; }
  .err-box{
    margin:14px 22px; padding:12px 14px; background:#f7e3de; border:1px dashed var(--over);
    border-radius:10px; font-size:12px; color:#7a2c1f; line-height:1.5;
  }
  .toast{
    margin:14px 22px; padding:12px 14px; background:#e7efe6; border:1px dashed var(--good);
    border-radius:10px; font-size:12.5px; color:#2f5b3f; line-height:1.5;
  }
  .eligibility-note{
    margin:14px 22px 0; padding:11px 13px; background:var(--paper-dim);
    border:1px dashed var(--brass-deep); border-radius:10px; font-size:11.5px;
    color:var(--ink-soft); line-height:1.5;
  }
  .eligibility-note b{ color:var(--ink); }

  .deadline-banner{
    padding:12px 22px; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    display:flex; justify-content:space-between; align-items:center; letter-spacing:.02em;
  }
  .deadline-banner.open{ background:#e7efe6; color:#2f5b3f; }
  .deadline-banner.soon{ background:#f6ecd5; color:#8a6a1f; }
  .deadline-banner.closed{ background:#f7e3de; color:#7a2c1f; }

  .locked-body{ padding:22px; text-align:center; }
  .locked-icon{ font-size:28px; margin-bottom:8px; }
  .locked-player{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:24px; margin:4px 0 2px; }
  .locked-sub{ font-size:12px; color:var(--ink-soft); }

  .preview-box{
    margin:10px 12px 14px; padding:14px 16px; background:var(--paper-dim);
    border-radius:12px; border:1px dashed var(--brass);
  }
  .preview-row{ display:flex; justify-content:space-between; align-items:baseline; padding:3px 0; font-size:13px; }
  .preview-row .k{ color:var(--ink-soft); }
  .preview-row .v{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .preview-row.new .v{ color:var(--good); font-size:15px; }
  .preview-arrow{ text-align:center; font-size:11px; color:var(--ink-soft); margin:2px 0; }
  .confirm-wrap{ padding:12px 22px 20px; }

  .primary-btn{
    width:100%; padding:12px; border-radius:10px; border:none;
    background:var(--ink); color:var(--paper); font-weight:600; font-size:13.5px;
    cursor:pointer; letter-spacing:.02em; font-family:'Inter',sans-serif;
  }
  .primary-btn:hover{ opacity:.92; }
  .primary-btn:disabled{ opacity:.45; cursor:default; }
  .primary-btn.margined{ margin:16px 22px 20px; width:calc(100% - 44px); }
  .pin-row{ display:flex; flex-direction:column; gap:8px; padding:0 22px 14px; }
  .pin-row input{
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line);
    background:#fff; font-family:'Inter',sans-serif; font-size:14px; color:var(--ink);
  }
  .pin-row button{
    width:100%; padding:11px 16px; border-radius:9px; border:none; background:var(--ink);
    color:var(--paper); font-weight:600; font-size:13px; cursor:pointer;
  }
  .pin-row button:disabled{ opacity:.45; }

  .summary-row{ display:flex; gap:8px; padding:14px 22px; border-bottom:1px dashed var(--line); }
  .summary-chip{ flex:1; text-align:center; padding:9px 6px; border-radius:9px; background:var(--paper-dim); }
  .summary-chip .num{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:20px; line-height:1; }
  .summary-chip .lbl{ font-family:'IBM Plex Mono',monospace; font-size:8.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px; }
  .summary-chip.submitted .num, .summary-chip.done .num{ color:var(--good); }
  .summary-chip.pending .num{ color:var(--warn); }
  .summary-chip.missed .num{ color:var(--over); }

  .round-chip{
    font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:15px;
    width:34px; height:34px; border-radius:8px; background:var(--field); color:var(--paper);
    display:flex; align-items:center; justify-content:center; flex:none; line-height:1;
  }

  .status-banner{ padding:14px 22px; font-size:13px; line-height:1.5; display:flex; align-items:center; gap:10px; }
  .status-banner.paid{ background:#e7efe6; color:#2f5b3f; }
  .status-banner.owed{ background:#f7e3de; color:#7a2c1f; }
  .status-banner .icon{ font-size:18px; flex:none; }
  .paid-pill{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.04em; text-transform:uppercase;
    padding:3px 9px; border-radius:20px; flex:none;
  }
  .paid-pill.yes{ background:rgba(63,125,84,.15); color:var(--good); }
  .paid-pill.no{ background:rgba(179,64,47,.12); color:var(--over); }
  .paid-toggle{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.03em; text-transform:uppercase;
    padding:5px 10px; border-radius:20px; flex:none; cursor:pointer; border:1px solid;
  }
  .paid-toggle.yes{ background:rgba(63,125,84,.12); color:var(--good); border-color:var(--good); }
  .paid-toggle.no{ background:rgba(179,64,47,.1); color:var(--over); border-color:var(--over); }
  .pot-box{ margin:8px 22px 4px; padding:14px 16px; background:var(--paper-dim); border-radius:12px; border:1px dashed var(--brass-deep); }
  .pot-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:2px 0; }
  .pot-row .k{ color:var(--ink-soft); }
  .pot-row .v{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .pot-note{ font-size:10.5px; color:var(--ink-soft); margin-top:6px; line-height:1.4; }

  table.standings{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.standings th{
    text-align:left; padding:8px 10px; font-family:'IBM Plex Mono',monospace; font-size:9.5px;
    letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); border-bottom:1px solid var(--line);
  }
  table.standings td{ padding:9px 10px; border-bottom:1px solid var(--paper-dim); }
  table.standings tr:last-child td{ border-bottom:none; }
  table.standings td.place{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:15px; width:24px; }
  table.standings td.team{ font-weight:600; }
  table.standings td.num{ font-family:'IBM Plex Mono',monospace; text-align:right; }
  tr.champ td.place{ color:var(--brass-deep); }
  tr.champ td.team::after{ content:' 🏆'; }

  .matchup{ margin:0 22px 12px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .matchup.decided{ border-color:var(--brass); }
  .mteam{ display:flex; align-items:center; gap:10px; padding:10px 14px; }
  .mteam.winner{ background:rgba(201,162,75,.14); font-weight:700; }
  .mteam .tname{ flex:1; font-size:13.5px; }
  .mteam .tscore{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; flex:none; }
  .mteam .trophy{ margin-left:4px; }

  /* ---- Championship celebration ---- */
  .champion-card{
    border:2px solid var(--brass) !important;
    background:linear-gradient(180deg, var(--paper) 0%, #f5ecd4 100%) !important;
    box-shadow:0 24px 48px -18px rgba(0,0,0,.55), 0 0 0 4px rgba(201,162,75,.14) !important;
  }
  .champion-card .card-head{ border-bottom-color:var(--brass); }
  .champion-card .eyebrow{ color:var(--brass-deep); font-size:11.5px; }
  .matchup.celebrate{ border-width:2px; }
  .matchup.celebrate .mteam{ padding:14px 16px; }
  .matchup.celebrate .mteam.winner{
    background:linear-gradient(90deg, rgba(201,162,75,.28), rgba(201,162,75,.12));
    font-weight:800;
  }
  .matchup.celebrate .mteam.winner .tname{ font-size:16px; }
  .matchup.celebrate .mteam.winner .tscore{ font-size:17px; color:var(--brass-deep); }
  .matchup.celebrate .mteam .trophy{ font-size:16px; }
  .mdivider{ height:1px; background:var(--line); }
  .bye-note{
    margin:0 22px 12px; padding:12px 14px; border:1px dashed var(--line); border-radius:12px;
    font-size:12px; color:var(--ink-soft); text-align:center;
  }
  .round-label{
    padding:14px 22px 8px; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--brass-deep);
  }
  .edit-matchup{ margin:0 22px 12px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; }
  .edit-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .edit-row:last-child{ margin-bottom:0; }
  .edit-row .tname{ flex:1; font-size:13px; font-weight:600; }
  .edit-row input[type=number]{
    width:54px; padding:6px 8px; border-radius:7px; border:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:center;
  }
  .edit-row .winner-check{ flex:none; }
  select.plain, input.plain{
    margin:0 22px; width:calc(100% - 44px); padding:10px 12px; border-radius:9px;
    border:1px solid var(--line); background:#fff; font-family:'Inter',sans-serif;
    font-size:14px; color:var(--ink);
  }
  .seed-grid{ padding:0 22px; display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .seed-grid label{ font-size:11px; color:var(--ink-soft); display:block; margin-bottom:3px; }

  .filters{ padding:12px 22px 0; display:flex; gap:8px; flex-wrap:wrap; }
  .filters select, .filters input{
    padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-family:'Inter',sans-serif; font-size:12.5px; color:var(--ink);
  }
  .filters .search{ flex:1; min-width:120px; }
  .filters select{ flex:none; }

  .section-label{
    padding:14px 22px 4px; font-family:'IBM Plex Mono',monospace; font-size:10px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);
    display:flex; justify-content:space-between; align-items:center;
  }
  .reset-link{
    background:none; border:none; color:var(--brass-deep); font-family:'IBM Plex Mono',monospace;
    font-size:10px; text-decoration:underline; cursor:pointer; padding:0;
  }

  .card-foot{
    padding:12px 22px 18px; display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft);
  }
  .refresh{
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.04em;
    padding:6px 10px; border-radius:8px; cursor:pointer;
  }
  .refresh:disabled{ opacity:.5; }

  .field-err{ color:var(--over); font-size:12px; margin:8px 22px 0; display:none; }
  .field-err.show{ display:block; }
  label{ display:block; font-size:12px; color:var(--ink-soft); margin:12px 22px 4px; }

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; background:var(--paper);
    border-top:1px solid var(--line); box-shadow:0 -8px 24px rgba(0,0,0,.3); z-index:10;
  }
  .bottom-nav-inner{ display:flex; justify-content:center; max-width:460px; margin:0 auto; }
  .nav-btn{
    flex:1; border:none; background:none; padding:10px 2px 8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--ink-soft);
    letter-spacing:.01em;
  }
  .nav-btn .ic{ line-height:1; }
  .nav-btn .ic svg{ width:17px; height:17px; display:block; margin:0 auto; }
  .nav-btn.active{ color:var(--brass-deep); }

  /* =====================================================================
     DESKTOP LAYOUT (min-width: 900px)
     Sidebar navigation replaces bottom nav + More overlay entirely.
     Content area widens and specific screens get real multi-column
     treatments (see per-screen desktop rules further down).
     ===================================================================== */
  .sidebar{ display:none; }
  @media (min-width: 900px){
    body{
      padding:0; align-items:flex-start; justify-content:flex-start;
    }
    .app-shell{
      display:flex; width:100%; min-height:100vh;
    }
    .sidebar{
      display:flex; flex-direction:column; width:220px; flex:none;
      background:var(--paper); border-right:1px solid var(--line);
      padding:28px 0; position:sticky; top:0; height:100vh; overflow-y:auto;
    }
    .sidebar-brand{
      font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:20px;
      text-transform:uppercase; padding:0 22px 22px; letter-spacing:.02em;
    }
    .sidebar-nav-btn{
      display:flex; align-items:center; gap:12px; padding:11px 22px; border:none;
      background:none; cursor:pointer; width:100%; text-align:left;
      font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft);
      border-left:3px solid transparent;
    }
    .sidebar-nav-btn .ic svg{ width:16px; height:16px; display:block; }
    .sidebar-nav-btn:hover{ background:var(--paper-dim); }
    .sidebar-nav-btn.active{ color:var(--brass-deep); border-left-color:var(--brass); background:var(--paper-dim); font-weight:600; }

    .bottom-nav, #moreOverlayRoot{ display:none; }

    .main-content{
      flex:1; padding:28px 40px 60px; max-width:1280px; margin:0 auto; width:100%;
    }
    .app{ max-width:none; width:100%; }
    .status{ max-width:640px; }
    .team-picker{ max-width:none; display:inline-flex; margin-bottom:20px; }
    .team-picker select{ flex:none; width:260px; }

    /* Generic desktop grid wrapper — mobile ignores this entirely (block/stack) */
    .desktop-grid{ display:grid; gap:16px; }
    .desktop-grid.cols-2{ grid-template-columns:1fr 1fr; }
    .desktop-grid.cols-3{ grid-template-columns:repeat(3, 1fr); }
    .desktop-grid.cols-4{ grid-template-columns:repeat(4, 1fr); }
    .desktop-grid > .card{ margin-bottom:0; }

    /* My Team: info/gauge card + roster card side by side */
    .myteam-desktop-split{ display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start; }

    /* League Overview: two-column list at desktop */
    .league-desktop .list{ display:grid; grid-template-columns:1fr 1fr; gap:2px 12px; }

    /* Draft Picks: mobile tab-based single-year card is hidden entirely at
       desktop, replaced by a 4-column simultaneous view */
    .draft-mobile-view{ display:none; }
    .draft-desktop-columns{ display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; }
    .draft-desktop-columns .card{ margin-bottom:0; }

    /* Movers & Shakers: gainers/losers side by side, no toggle needed */
    .movers-mobile-view{ display:none; }
    .movers-desktop-columns{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .movers-desktop-columns .card{ margin-bottom:0; }

    /* Salary Exempt: roster (left) + sticky deadline/preview panel (right) */
    .exempt-desktop-split{ display:grid; grid-template-columns:1fr 360px; gap:16px; align-items:start; }
    .exempt-desktop-split .sticky-panel{ position:sticky; top:28px; }

    /* What-If: roster/reset (left) + add-a-player (right); cap summary spans both */
    .whatif-desktop-split{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }

    /* Dues/Payouts: paired sub-cards side by side */
    .dues-desktop-pair{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
    .dues-desktop-pair .card{ margin-bottom:0; }

    /* Standings: two snapshot tables side by side */
    .standings-desktop-pair{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .standings-desktop-pair .card{ margin-bottom:0; }

    /* Bracket: rounds flow left-to-right as columns instead of stacking */
    .bracket-desktop-columns{ display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; align-items:start; }
    .bracket-desktop-columns .card{ margin-bottom:0; }

    /* Commissioner: checklist + CBS queue side by side */
    .commish-desktop-split{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
    .commish-desktop-split .card{ margin-bottom:0; }
  }
  @media (max-width: 899px){
    .movers-desktop-columns{ display:none; }
    .bracket-desktop-columns{ display:none; }
  }
  @media (max-width: 899px){
    .draft-mobile-view{ display:block; }
    .draft-desktop-columns{ display:none; }
  }

  /* ---- More overlay ---- */
  .more-overlay{
    position:fixed; inset:0; background:rgba(22,38,28,.7); z-index:20;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .more-sheet{
    width:100%; max-width:460px; background:var(--paper); border-radius:20px 20px 0 0;
    padding:20px 16px 28px; box-shadow:0 -20px 50px rgba(0,0,0,.4);
  }
  .more-sheet-head{
    display:flex; justify-content:space-between; align-items:center; padding:0 8px 14px;
  }
  .more-sheet-head h2{
    font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:20px;
    text-transform:uppercase; margin:0; letter-spacing:.01em;
  }
  .more-close{
    border:none; background:var(--paper-dim); width:30px; height:30px; border-radius:50%;
    font-size:16px; color:var(--ink-soft); cursor:pointer;
  }
  .more-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .more-item{
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:16px 8px;
    border-radius:14px; border:1px solid var(--line); background:var(--paper-dim);
    cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink);
  }
  .more-item .ic svg{ width:22px; height:22px; display:block; }
  .more-item.active{ border-color:var(--brass); background:rgba(201,162,75,.14); color:var(--brass-deep); }
</style>
</head>
<body>

<div class="app-shell">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand">🏈 League Dashboard</div>
    <div id="sidebarNav"></div>
  </div>

  <div class="main-content">
    <div class="app">
      <div class="status">
        <span><span class="dot pending" id="statusDot"></span><span id="statusText">connecting…</span></span>
        <span>LIVE — POLLS EVERY 75s</span>
      </div>

      <div class="team-picker" id="teamPickerWrap" style="display:none;">
        <select id="teamSelect"></select>
        <button class="commish-pill" id="commishToggleBtn">🛠️</button>
      </div>

      <div id="viewRoot"></div>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <div class="bottom-nav-inner" id="bottomNav"></div>
</div>

<div id="moreOverlayRoot"></div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxVGwkt88noCmju0w9z8RhJdWFBSx9TMjJOZPp2MHpIpXQ006WG69kWyMxGKveprg-RMg/exec";
const POLL_MS = 75000;
const POSITION_ORDER = { QB: 0, RB: 1, WR: 2, TE: 3, K: 4, DST: 5 };
const TEAM_TABS = ['team', 'picks', 'exempt', 'whatif'];
const COMMISH_TABS = ['dues', 'standings', 'commish'];

const state = {
  activeTab: 'team',
  selectedTeam: null,
  data: {
    salaryCap: null, roster: null, exemptSelections: null, checklist: null, config: null,
    draftPicks: null, movers: null, allPlayers: null, duesPayouts: null, standings: null, bracket: null,
  },
  ui: {
    teamSort: 'position',
    exemptSort: 'position',
    exemptSelectedPlayer: null,
    exemptPin: '',
    draftYear: '2026',
    moversView: 'gainers',
    leagueSort: 'cap',
    commissioner: null,
    whatIfRemoved: new Set(),
    whatIfAdded: [],
    whatIfSearch: '',
    whatIfTeamFilter: 'all',
    whatIfPosFilter: 'all',
    standingsView: 'standings',
    bracketEditMode: false,
    bracketDraft: null,
  },
};

async function get(resource, params){
  const qs = new URLSearchParams({ resource, ...(params||{}) });
  const res = await fetch(ENDPOINT + '?' + qs.toString());
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
async function post(body){
  const res = await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(body) });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
function fmtMoney(n){ return typeof n === 'number' ? '$' + n.toLocaleString() : '—'; }
function posRank(pos){ const p=(pos||'').toUpperCase(); return POSITION_ORDER.hasOwnProperty(p)?POSITION_ORDER[p]:99; }
function posClass(pos){
  const p=(pos||'').toUpperCase();
  return ['QB','RB','WR','TE','K','DST'].includes(p) ? 'pos-'+p : 'pos-other';
}
function sortedRoster(roster, mode){
  const list = [...roster];
  if (mode === 'salary') list.sort((a,b) => b.salary - a.salary);
  else list.sort((a,b) => posRank(a.position)-posRank(b.position) || b.salary-a.salary);
  return list;
}

const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
function setStatus(s, t){ dot.className='dot '+s; statusText.textContent=t; }

async function refreshAll(isInitial){
  setStatus('pending', isInitial ? 'connecting…' : 'syncing…');
  try {
    const [cap, exempt, checklist, config, draft, movers, dues, standings, bracket] = await Promise.all([
      get('salarycap'), get('exemptstatus'), get('checklist'), get('config'),
      get('draftpicks'), get('moversshakers'), get('duespayouts'),
      get('standings'), get('bracket'),
    ]);
    state.data.salaryCap = cap;
    state.data.exemptSelections = exempt;
    state.data.checklist = checklist;
    state.data.config = config;
    state.data.draftPicks = draft;
    state.data.movers = movers;
    state.data.duesPayouts = dues;
    state.data.standings = standings;
    state.data.bracket = bracket.bracket;

    if (isInitial){
      state.selectedTeam = cap.teams[0].team;
      const sel = document.getElementById('teamSelect');
      sel.innerHTML = cap.teams.map(t => `<option value="${t.team}">${t.team}</option>`).join('');
      sel.value = state.selectedTeam;
    }

    if (TEAM_TABS.includes(state.activeTab) && state.selectedTeam){
      state.data.roster = await get('roster', { team: state.selectedTeam });
    }
    // allplayers is the full player universe (large) — only fetch it when
    // the What-If tab is actually the one being viewed, not on every poll.
    if (state.activeTab === 'whatif' && !state.data.allPlayers){
      state.data.allPlayers = await get('allplayers');
    }

    clearError();
    setStatus('ok', 'synced ' + new Date().toLocaleTimeString());
    render();
  } catch (err){
    setStatus('err', 'sync failed');
    showError(err.message + ' — will retry automatically.');
  }
}

function showError(msg){
  const root = document.getElementById('viewRoot');
  const existing = root.querySelector('.err-box');
  if (existing) existing.remove();
  const box = document.createElement('div');
  box.className = 'err-box';
  box.innerHTML = `<b>Sync issue:</b> ${msg}`;
  root.prepend(box);
}
function clearError(){
  const existing = document.querySelector('.err-box');
  if (existing) existing.remove();
}

document.getElementById('teamSelect').addEventListener('change', async (e) => {
  state.selectedTeam = e.target.value;
  if (TEAM_TABS.includes(state.activeTab)){
    state.data.roster = await get('roster', { team: state.selectedTeam });
  }
  state.ui.exemptSelectedPlayer = null;
  state.ui.whatIfRemoved = new Set();
  state.ui.whatIfAdded = [];
  render();
});

document.getElementById('commishToggleBtn').addEventListener('click', () => {
  if (state.ui.commissioner){
    state.ui.commissioner = null;
    state.ui.bracketEditMode = false;
    document.getElementById('commishToggleBtn').classList.remove('active');
    render();
    return;
  }
  const pin = prompt('Commissioner PIN:');
  if (!pin) return;
  state.ui.commissioner = { pin };
  document.getElementById('commishToggleBtn').classList.add('active');
  render();
});

const ICONS = {
  team: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 5 6v3h2v10h10V9h2V6l-4-3-2 2h-2z"/></svg>',
  league: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="19" y1="20" x2="19" y2="14"/></svg>',
  picks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.3"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>',
  movers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,17 10,11 14,15 20,7"/><polyline points="14,7 20,7 20,13"/></svg>',
  exempt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6.5 3h11a.5.5 0 0 1 .5.5V21l-6-4.2L6 21V3.5a.5.5 0 0 1 .5-.5z"/></svg>',
  whatif: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h4"/><path d="M10.5 3v6L5.4 18a1.3 1.3 0 0 0 1.1 2h11a1.3 1.3 0 0 0 1.1-2L13.5 9V3"/><line x1="8" y1="14.5" x2="16" y2="14.5"/></svg>',
  dues: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.3" stroke-linecap="butt"/><path d="M12 7.3v9.4M14.7 9.6c0-1.2-1.2-2.1-2.7-2.1s-2.7.9-2.7 2c0 2.6 5.4 1.3 5.4 3.9 0 1.1-1.2 2.1-2.7 2.1s-2.7-.9-2.7-2.1"/></svg>',
  standings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4.5a4 4 0 0 1-8 0V4z"/><path d="M8 5.2H5.3A2.6 2.6 0 0 0 8 8.6"/><path d="M16 5.2h2.7A2.6 2.6 0 0 1 16 8.6"/><line x1="12" y1="12.5" x2="12" y2="16.5"/><line x1="8.7" y1="19.5" x2="15.3" y2="19.5"/><line x1="12" y1="16.5" x2="12" y2="19.5"/></svg>',
  commish: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.7"/><path d="M12 4v2.2M12 17.8V20M4 12h2.2M17.8 12H20M6.5 6.5l1.5 1.5M16 16l1.5 1.5M17.5 6.5 16 8M8 16l-1.5 1.5"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
};

const PRIMARY_TABS = [
  { id: 'team', icon: ICONS.team, label: 'Team' },
  { id: 'league', icon: ICONS.league, label: 'League' },
  { id: 'whatif', icon: ICONS.whatif, label: 'What-If' },
];
const MORE_TABS = [
  { id: 'picks', icon: ICONS.picks, label: 'Picks' },
  { id: 'movers', icon: ICONS.movers, label: 'Movers' },
  { id: 'exempt', icon: ICONS.exempt, label: 'Exempt' },
  { id: 'dues', icon: ICONS.dues, label: 'Dues' },
  { id: 'standings', icon: ICONS.standings, label: 'Standings' },
  { id: 'commish', icon: ICONS.commish, label: 'Commish' },
];
const TABS = PRIMARY_TABS.concat(MORE_TABS);

async function loadDataForTab(){
  if (TEAM_TABS.includes(state.activeTab) && !state.data.roster){
    state.data.roster = await get('roster', { team: state.selectedTeam });
  }
  if (state.activeTab === 'whatif' && !state.data.allPlayers){
    state.data.allPlayers = await get('allplayers');
  }
}

function renderSidebarNav(){
  const el = document.getElementById('sidebarNav');
  if (!el) return;
  el.innerHTML = TABS.map(t =>
    `<button class="sidebar-nav-btn${t.id===state.activeTab?' active':''}" data-sidebar-tab="${t.id}"><span class="ic">${t.icon}</span>${t.label}</button>`
  ).join('');
  el.querySelectorAll('[data-sidebar-tab]').forEach(btn => {
    btn.addEventListener('click', async () => {
      state.activeTab = btn.getAttribute('data-sidebar-tab');
      await loadDataForTab();
      render();
    });
  });
}

function renderBottomNav(){
  renderSidebarNav();
  const isMoreActive = MORE_TABS.some(t => t.id === state.activeTab);
  const activeMoreTab = MORE_TABS.find(t => t.id === state.activeTab);
  const moreIcon = activeMoreTab ? activeMoreTab.icon : ICONS.more;
  const moreLabel = activeMoreTab ? activeMoreTab.label : 'More';

  const items = PRIMARY_TABS.map(t =>
    `<button class="nav-btn${t.id===state.activeTab?' active':''}" data-tab="${t.id}"><span class="ic">${t.icon}</span>${t.label}</button>`
  ).join('') + `<button class="nav-btn${isMoreActive?' active':''}" id="moreNavBtn"><span class="ic">${moreIcon}</span>${moreLabel}</button>`;

  document.getElementById('bottomNav').innerHTML = items;

  document.querySelectorAll('.nav-btn[data-tab]').forEach(btn => {
    btn.addEventListener('click', async () => {
      state.activeTab = btn.getAttribute('data-tab');
      await loadDataForTab();
      render();
    });
  });
  document.getElementById('moreNavBtn').addEventListener('click', openMoreOverlay);
}

function openMoreOverlay(){
  const overlay = document.createElement('div');
  overlay.className = 'more-overlay';
  overlay.id = 'moreOverlay';
  overlay.innerHTML = `
    <div class="more-sheet">
      <div class="more-sheet-head"><h2>More</h2><button class="more-close" id="moreCloseBtn">✕</button></div>
      <div class="more-grid">
        ${MORE_TABS.map(t => `<div class="more-item${t.id===state.activeTab?' active':''}" data-more-tab="${t.id}"><span class="ic">${t.icon}</span>${t.label}</div>`).join('')}
      </div>
    </div>`;
  document.getElementById('moreOverlayRoot').appendChild(overlay);

  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeMoreOverlay(); });
  document.getElementById('moreCloseBtn').addEventListener('click', closeMoreOverlay);
  overlay.querySelectorAll('[data-more-tab]').forEach(item => {
    item.addEventListener('click', async () => {
      state.activeTab = item.getAttribute('data-more-tab');
      closeMoreOverlay();
      await loadDataForTab();
      render();
    });
  });
}
function closeMoreOverlay(){
  const overlay = document.getElementById('moreOverlay');
  if (overlay) overlay.remove();
}

renderBottomNav();

function updateTeamPickerVisibility(){
  const showTeamSelect = TEAM_TABS.includes(state.activeTab);
  const showCommishPill = COMMISH_TABS.includes(state.activeTab);
  document.getElementById('teamPickerWrap').style.display = (showTeamSelect || showCommishPill) ? 'flex' : 'none';
  document.getElementById('teamSelect').style.display = showTeamSelect ? 'block' : 'none';
}

function render(){
  renderBottomNav();
  updateTeamPickerVisibility();
  const root = document.getElementById('viewRoot');
  switch (state.activeTab){
    case 'team': root.innerHTML = renderMyTeam(); attachMyTeamHandlers(); break;
    case 'league': root.innerHTML = renderLeague(); attachLeagueHandlers(); break;
    case 'picks': root.innerHTML = renderDraftPicks(); attachDraftHandlers(); break;
    case 'movers': root.innerHTML = renderMovers(); attachMoversHandlers(); break;
    case 'exempt': root.innerHTML = renderExempt(); attachExemptHandlers(); break;
    case 'whatif': root.innerHTML = renderWhatIf(); attachWhatIfHandlers(); break;
    case 'dues': root.innerHTML = renderDues(); attachDuesHandlers(); break;
    case 'standings': root.innerHTML = renderStandingsTab(); attachStandingsHandlers(); break;
    case 'commish': root.innerHTML = renderCommish(); attachCommishHandlers(); break;
  }
}

function renderMyTeam(){
  const cap = state.data.salaryCap;
  const roster = state.data.roster;
  if (!cap || !roster) return `<div class="card"><div class="placeholder">Loading…</div></div>`;

  const info = cap.teams.find(t => t.team === state.selectedTeam);
  const myExempt = state.data.exemptSelections.selections.find(s => s.team === state.selectedTeam);
  const exemptPlayer = myExempt ? myExempt.player : null;
  const cbsDone = state.data.checklist.checklist.find(c => c.team === state.selectedTeam);
  const cbsUpdateDone = !!(cbsDone && cbsDone.done);

  const circumference = 283;
  const pct = info ? info.capUsedPct : 0;
  const offset = circumference - (Math.min(pct,100)/100)*circumference;
  const arcColor = pct > 100 ? '#b3402f' : (pct > 90 ? '#c9a24b' : '#3f7d54');

  const sorted = sortedRoster(roster.roster, state.ui.teamSort);
  const rows = sorted.map(p => {
    const isExempt = p.player === exemptPlayer;
    const note = (isExempt && !cbsUpdateDone) ? ' · pending $0 update' : '';
    return `
      <div class="row${isExempt ? ' is-exempt':''}">
        <span class="pos ${posClass(p.position)}">${p.position||'—'}</span>
        <span class="rname"><span class="n">${p.player}${isExempt?'<span class="tag exempt">EXEMPT</span>':''}</span><span class="t"> · ${p.nflTeam||'—'}${note}</span></span>
        <span class="rsal">$${p.salary}</span>
      </div>`;
  }).join('');

  return `
    <div class="myteam-desktop-split">
      <div class="card">
        <div class="card-head">
          <p class="eyebrow">My Team</p>
          <h1>${state.selectedTeam || '—'}</h1>
        </div>
        <div class="gauge-wrap" style="border-bottom:none;">
          <div class="gauge">
            <svg width="104" height="104" viewBox="0 0 104 104">
              <circle cx="52" cy="52" r="45" fill="none" stroke="#e4dcc4" stroke-width="9"/>
              <circle cx="52" cy="52" r="45" fill="none" stroke="${arcColor}" stroke-width="9" stroke-linecap="round"
                transform="rotate(-90 52 52)" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
            </svg>
            <div class="gauge-num"><span class="pct">${pct}%</span><span class="lbl">of cap</span></div>
          </div>
          <div class="cap-figures">
            <div class="cap-row"><span class="k">Salary used</span><span class="v">${fmtMoney(info?info.totalSalary:0)}</span></div>
            <div class="cap-row"><span class="k">League cap</span><span class="v">${fmtMoney(info?info.cap:200)}</span></div>
            <div class="cap-divider"></div>
            <div class="cap-row"><span class="k">Remaining</span><span class="v ${info&&info.capSpace<0?'over':'accent'}">${fmtMoney(info?info.capSpace:0)}</span></div>
          </div>
        </div>
        <div class="card-foot" style="border-top:1px dashed var(--line);"><span>SOURCE: ${roster.salaryTabUsed}</span><button class="refresh" id="refreshBtn">↻ Refresh</button></div>
      </div>
      <div class="card">
        <div class="card-head"><p class="eyebrow">Roster</p><h1>${sorted.length} Players</h1></div>
        <div class="toggle-row">
          <button class="toggle-btn${state.ui.teamSort==='position'?' active':''}" data-sort="position">By Position</button>
          <button class="toggle-btn${state.ui.teamSort==='salary'?' active':''}" data-sort="salary">By Salary</button>
        </div>
        <div class="list">${rows}</div>
      </div>
    </div>`;
}

  document.querySelectorAll('[data-sort]').forEach(btn => {

function renderLeague(){
  const cap = state.data.salaryCap;
  if (!cap) return `<div class="card"><div class="placeholder">Loading…</div></div>`;

  let teams = [...cap.teams];
  if (state.ui.leagueSort === 'cap') teams.sort((a,b) => a.capSpace - b.capSpace);
  else teams.sort((a,b) => a.team.localeCompare(b.team));

  const rows = teams.map((t,i) => {
    const over = t.capSpace < 0;
    const pct = Math.min(t.capUsedPct, 100);
    const barColor = over ? 'var(--over)' : (t.capUsedPct>90 ? 'var(--warn)' : 'var(--good)');
    const isMine = t.team === state.selectedTeam;
    return `
      <div class="row${isMine?' mine':''}">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);width:16px;text-align:right;">${i+1}</span>
        <div class="rname">
          <span class="n">${t.team}${isMine?'<span class="tag you">YOU</span>':''}${over?'<span class="tag over">Over Cap</span>':''}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${barColor};"></div></div>
        </div>
        <div style="text-align:right;">
          <div class="rsal" style="color:${over?'var(--over)':'var(--ink)'};">${over?'−':''}${fmtMoney(Math.abs(t.capSpace))}</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);">${t.capUsedPct}%</div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="card league-desktop">
      <div class="card-head">
        <p class="eyebrow">League Overview</p>
        <h1>All 12 Teams</h1>
        <p class="subtext">Sorted to surface trade targets — tightest cap space needs to shed salary.</p>
      </div>
      <div class="toggle-row">
        <button class="toggle-btn${state.ui.leagueSort==='cap'?' active':''}" data-lsort="cap">Cap Space ↑</button>
        <button class="toggle-btn${state.ui.leagueSort==='az'?' active':''}" data-lsort="az">A–Z</button>
      </div>
      <div class="list">${rows}</div>
      <div class="card-foot"><span>SOURCE: League Salary Cap</span><button class="refresh" id="refreshBtn">↻ Refresh</button></div>
    </div>`;
}

function renderDraftPicks(){
  const draft = state.data.draftPicks;
  if (!draft) return `<div class="card"><div class="placeholder">Loading…</div></div>`;

  const years = ['2026','2027','2028','2029'];

  function picksForYear(year){
    const list = draft.picks.filter(p => p.currentOwnerTeam === state.selectedTeam && p.year === year);
    list.sort((a,b) => {
      const ra = parseInt(a.round,10)||0, rb = parseInt(b.round,10)||0;
      if (ra !== rb) return ra-rb;
      return (parseInt(a.pick,10)||0) - (parseInt(b.pick,10)||0);
    });
    return list;
  }
  function rowsHtml(list){
    return list.map(p => {
      const label = p.pick ? `Round ${p.round}, Pick ${p.pick}` : `Round ${p.round}`;
      const sub = p.overallPick ? `Overall #${p.overallPick}` : '';
      return `
        <div class="row">
          <span class="round-chip">${p.round}</span>
          <div class="rname"><span class="n">${label}</span>${sub?`<div class="t">${sub}</div>`:''}</div>
          ${p.traded?`<span class="tag team">via ${p.originalOwnerTeam}</span>`:''}
        </div>`;
    }).join('') || `<div class="placeholder">No picks found.</div>`;
  }

  // ---- Mobile: single card, tab-switched between years ----
  const mobileYearPicks = picksForYear(state.ui.draftYear);
  const mobileView = `
    <div class="draft-mobile-view">
      <div class="card">
        <div class="card-head">
          <p class="eyebrow">Draft Picks</p>
          <h1>${state.selectedTeam || '—'}</h1>
        </div>
        <div class="underline-tabs">${years.map(y => `<button class="u-tab${y===state.ui.draftYear?' active':''}" data-year="${y}">${y}</button>`).join('')}</div>
        <p class="subtext" style="padding:12px 22px 0;">${mobileYearPicks.length} pick${mobileYearPicks.length!==1?'s':''} in ${state.ui.draftYear}</p>
        <div class="list">${rowsHtml(mobileYearPicks)}</div>
        <div class="card-foot"><span>SOURCE: Draft Picks</span><button class="refresh" id="refreshBtn">↻ Refresh</button></div>
      </div>
    </div>`;

  // ---- Desktop: all 4 years side by side, no tab-switching needed ----
  const desktopView = `
    <div class="draft-desktop-columns">
      ${years.map(y => {
        const list = picksForYear(y);
        return `
          <div class="card">
            <div class="card-head">
              <p class="eyebrow">${y}</p>
              <h1 style="font-size:20px;">${list.length} Pick${list.length!==1?'s':''}</h1>
            </div>
            <div class="list">${rowsHtml(list)}</div>
          </div>`;
      }).join('')}
    </div>`;

  return mobileView + desktopView;
}

function deadlineState(){
  const config = state.data.config;
  if (!config || !config.exemptDeadline) return { state:'open', label:'No deadline set yet', ms:null };
  const d = new Date(config.exemptDeadline);
  if (isNaN(d.getTime())) return { state:'open', label:'No deadline set yet', ms:null };
  const ms = d.getTime() - Date.now();
  if (ms <= 0) return { state:'closed', label:'Deadline passed', ms };
  const hrs = ms / 3.6e6;
  return { state: hrs<24?'soon':'open', label:'Deadline: '+d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}), ms };
}
function fmtRemaining(ms){
  const totalHrs = Math.floor(ms/3.6e6), days = Math.floor(totalHrs/24), hrs = totalHrs%24;
  return days>0 ? `${days}d ${hrs}h remaining` : `${hrs}h remaining`;
}

  if ((existing && existing.locked) || ds.state === 'closed'){
    const body = existing
      ? `<div class="locked-icon">🔒</div><div class="locked-player">${existing.player}</div><div class="locked-sub">Locked in as your Salary Exempt pick.</div>`

    return `<div class="card"><div class="card-head"><p class="eyebrow">Salary Exempt</p><h1>${state.selectedTeam||'—'}</h1></div>${bannerHtml}<div class="locked-body">${body}</div></div>`;

      try {

        submitBtn.disabled = false; submitBtn.textContent = 'Submit';
      }

function computeHypotheticalTotal(){
  const info = state.data.salaryCap.teams.find(t => t.team === state.selectedTeam);
  const baseTotal = info ? info.totalSalary : 0;
  let removedSum = 0;
  state.data.roster.roster.forEach(p => { if (state.ui.whatIfRemoved.has(p.player)) removedSum += p.salary; });
  let addedSum = state.ui.whatIfAdded.reduce((s,p) => s + p.salary, 0);
  return { baseTotal, hypTotal: baseTotal - removedSum + addedSum, cap: info ? info.cap : 200 };
}

function renderWhatIf(){
  if (!state.data.roster || !state.data.allPlayers) return `<div class="card"><div class="placeholder">Loading…</div></div>`;

  const { baseTotal, hypTotal, cap } = computeHypotheticalTotal();
  const overCap = hypTotal > cap;
  const space = cap - hypTotal;

  let html = `<div class="card">
    <div class="card-head">
      <p class="eyebrow">What-If Tool</p>
      <h1>${state.selectedTeam||'—'}</h1>
      <p class="subtext">Model a hypothetical roster. Nothing here is saved anywhere — it's a sandbox to check cap impact before a real move.</p>
    </div>
    <div class="cap-summary">
      <div class="cap-block"><div class="lbl">Current</div><div class="val">${fmtMoney(baseTotal)}</div></div>
      <div class="cap-arrow">→</div>
      <div class="cap-block"><div class="lbl">Hypothetical</div><div class="val ${overCap?'over':'good'}">${fmtMoney(hypTotal)}</div></div>
      <div class="cap-block"><div class="lbl">Cap Space</div><div class="val ${space<0?'over':'good'}">${space<0?'−':''}${fmtMoney(Math.abs(space))}</div></div>
    </div>
  </div>`;

  // ---- Left: Added-this-scenario + Your Roster ----
  let leftCard = `<div class="card">`;
  if (state.ui.whatIfAdded.length > 0){
    leftCard += `<div class="section-label">Added This Scenario</div><div class="list">`;
    leftCard += state.ui.whatIfAdded.map(p => {
      const teamTag = p.fantasyTeam
        ? `<span class="tag team">via ${p.fantasyTeam}</span>`
        : `<span class="tag team fa">Free Agent</span>`;
      return `
        <div class="row adding clickable" data-remove-added="${p.player}">
          <span class="pos ${posClass(p.position)}">${p.position||'—'}</span>
          <span class="rname"><span class="n">${p.player}${teamTag}</span><span class="t"> · ${p.nflTeam||'—'}</span></span>

          <span class="action-icon remove">✕</span>
        </div>`;
    }).join('');
    leftCard += `</div>`;
  }
  leftCard += `<div class="section-label">Your Roster <button class="reset-link" id="resetScenarioBtn">Reset scenario</button></div><div class="list">`;
  const sortedRosterList = [...state.data.roster.roster].sort((a,b) => posRank(a.position)-posRank(b.position) || b.salary-a.salary);
  leftCard += sortedRosterList.map(p => {
    const isRemoved = state.ui.whatIfRemoved.has(p.player);
    return `
      <div class="row clickable${isRemoved?' removing':''}" data-toggle-remove="${p.player}">
        <span class="pos ${posClass(p.position)}">${p.position||'—'}</span>
        <span class="rname"><span class="n">${p.player}</span><span class="t"> · ${p.nflTeam||'—'}</span></span>
        <span class="rsal">$${p.salary}</span>
        <span class="action-icon remove">${isRemoved?'↺':'✕'}</span>
      </div>`;
  }).join('');
  leftCard += `</div></div>`;

  // ---- Right: Add a Player ----
  const rightCard = `<div class="card">
    <div class="section-label">Add a Player</div>
    <div class="filters">
      <input class="search" id="whatIfSearch" placeholder="Search player name…" value="${state.ui.whatIfSearch}">
      <select id="whatIfTeamFilter">
        <option value="all"${state.ui.whatIfTeamFilter==='all'?' selected':''}>All / Free Agents</option>
        <option value="fa"${state.ui.whatIfTeamFilter==='fa'?' selected':''}>Free Agents Only</option>
        ${state.data.salaryCap.teams.map(t => `<option value="${t.team}"${state.ui.whatIfTeamFilter===t.team?' selected':''}>${t.team}</option>`).join('')}
      </select>
      <select id="whatIfPosFilter">
        <option value="all"${state.ui.whatIfPosFilter==='all'?' selected':''}>All Positions</option>
        ${['QB','RB','WR','TE','K','DST'].map(p => `<option value="${p}"${state.ui.whatIfPosFilter===p?' selected':''}>${p}</option>`).join('')}
      </select>
    </div>
    <div class="list" id="whatIfAddList"></div>
    <div class="eligibility-note"><b>Note:</b> this models your team's cap only — if a player comes off another roster, that team would need its own corresponding move.</div>
    <div id="whatIfErrBox"></div>
    <div class="card-foot"><span>SOURCE: League Salary Cap · Player Salaries</span><button class="refresh" id="refreshBtn">↻ Refresh</button></div>
  </div>`;

  html += `<div class="whatif-desktop-split">${leftCard}${rightCard}</div>`;

  return html;
}

function renderWhatIfAddList(){
  const el = document.getElementById('whatIfAddList');
  if (!el) return;

  const search = state.ui.whatIfSearch.trim().toLowerCase();
  const hasRealFilter = search || state.ui.whatIfTeamFilter !== 'all' || state.ui.whatIfPosFilter !== 'all';
  if (!hasRealFilter){
    el.innerHTML = '<div class="placeholder">Search a name or pick a filter above to browse players — the full player pool is too large to show all at once.</div>';
    return;
  }

  let pool = state.data.allPlayers.players.filter(p => p.fantasyTeam !== state.selectedTeam);
  if (search) pool = pool.filter(p => p.player.toLowerCase().includes(search));
  if (state.ui.whatIfTeamFilter === 'fa') pool = pool.filter(p => !p.fantasyTeam);
  else if (state.ui.whatIfTeamFilter !== 'all') pool = pool.filter(p => p.fantasyTeam === state.ui.whatIfTeamFilter);
  if (state.ui.whatIfPosFilter !== 'all') pool = pool.filter(p => (p.position||'').toUpperCase() === state.ui.whatIfPosFilter);
  pool.sort((a,b) => posRank(a.position)-posRank(b.position) || b.salary-a.salary);
  const totalMatches = pool.length;
  pool = pool.slice(0, 40);

  if (pool.length === 0){ el.innerHTML = '<div class="placeholder">No players match these filters.</div>'; return; }

  el.innerHTML = pool.map(p => {
    const isAdded = state.ui.whatIfAdded.some(a => a.player === p.player);
    const teamTag = p.fantasyTeam ? `<span class="tag team">${p.fantasyTeam}</span>` : `<span class="tag team fa">Free Agent</span>`;
    return `
      <div class="row clickable${isAdded?' adding':''}" data-toggle-add="${p.player}">
        <span class="pos ${posClass(p.position)}">${p.position||'—'}</span>
        <span class="rname"><span class="n">${p.player}${teamTag}</span><span class="t"> · ${p.nflTeam||'—'}</span></span>
        <span class="rsal">$${p.salary}</span>
        <span class="action-icon add">${isAdded?'↺':'+'}</span>
      </div>`;
  }).join('');
  if (totalMatches > 40){
    el.innerHTML += `<div class="placeholder" style="padding:10px 12px;">Showing 40 of ${totalMatches} matches — narrow your search further to see more specific results.</div>`;
  }

  el.querySelectorAll('[data-toggle-add]').forEach(row => {
    row.addEventListener('click', () => {
      const name = row.getAttribute('data-toggle-add');
      const idx = state.ui.whatIfAdded.findIndex(a => a.player === name);
      if (idx !== -1) state.ui.whatIfAdded.splice(idx, 1);
      else {
        const p = state.data.allPlayers.players.find(pl => pl.player === name);
        if (p) state.ui.whatIfAdded.push(p);
      }
      render();
    });
  });
}

function attachWhatIfHandlers(){
  renderWhatIfAddList();
  document.getElementById('resetScenarioBtn').addEventListener('click', () => {
    state.ui.whatIfRemoved = new Set(); state.ui.whatIfAdded = []; render();
  });
  document.querySelectorAll('[data-toggle-remove]').forEach(row => {
    row.addEventListener('click', () => {
      const name = row.getAttribute('data-toggle-remove');
      if (state.ui.whatIfRemoved.has(name)) state.ui.whatIfRemoved.delete(name);
      else state.ui.whatIfRemoved.add(name);
      render();
    });
  });
  document.querySelectorAll('[data-remove-added]').forEach(row => {
    row.addEventListener('click', () => {
      const name = row.getAttribute('data-remove-added');
      state.ui.whatIfAdded = state.ui.whatIfAdded.filter(a => a.player !== name);
      render();
    });
  });
  document.getElementById('whatIfSearch').addEventListener('input', (e) => { state.ui.whatIfSearch = e.target.value; renderWhatIfAddList(); });
  document.getElementById('whatIfTeamFilter').addEventListener('change', (e) => { state.ui.whatIfTeamFilter = e.target.value; renderWhatIfAddList(); });
  document.getElementById('whatIfPosFilter').addEventListener('change', (e) => { state.ui.whatIfPosFilter = e.target.value; renderWhatIfAddList(); });
  const rb = document.getElementById('refreshBtn');
  if (rb) rb.addEventListener('click', () => refreshAll(false));
}

async function togglePaid(section, key, currentlyPaid, btnEl){
  if (!state.ui.commissioner){ alert('Unlock Commish mode first (top-right pill) to change paid status.'); return; }
  btnEl.disabled = true;
  try {
    await post({ action:'markduespaid', pin: state.ui.commissioner.pin, section, key, paid: !currentlyPaid });
    state.data.duesPayouts = await get('duespayouts');
    render();
  } catch (err) {
    showError('Could not update paid status: ' + err.message);
    btnEl.disabled = false;
  }
}

function renderDues(){
  const d = state.data.duesPayouts;
  if (!d) return `<div class="card"><div class="placeholder">Loading…</div></div>`;

    teamDuesCard += `<div class="pot-box" style="margin-top:0;">
      <div class="pot-row"><span class="k">Anticipated total (if all paid)</span><span class="v">${fmtMoney(d.duesTotals.anticipated)}</span></div>
      <div class="pot-row"><span class="k">Actual collected so far</span><span class="v">${fmtMoney(d.duesTotals.actual)}</span></div>
    </div>`;

  teamDuesCard += `</div>`;

  let weeklyCard = `<div class="card"><div class="card-head"><p class="eyebrow">Weekly High Score</p><h1>$25 Pot</h1></div><div class="list">`;
  d.weeklyHighScore.forEach(w => {
    weeklyCard += `<div class="row">
      <div class="rname"><span class="n">Week ${w.week}</span><span class="t"> · ${w.winner||'Not yet set'}</span></div>
      <span class="rsal">$${w.amount}</span>
      ${isCommish ? `<button class="paid-toggle ${w.paid?'yes':'no'}" data-toggle-week="${w.week}" data-paid="${w.paid}">${w.paid?'Paid':'Unpaid'}</button>` : `<span class="paid-pill ${w.paid?'yes':'no'}">${w.paid?'Paid':'Unpaid'}</span>`}
    </div>`;
  });
  weeklyCard += `</div></div>`;

  html += `<div class="dues-desktop-pair">${teamDuesCard}${weeklyCard}</div>`;

  let playoffCard = `<div class="card"><div class="card-head"><p class="eyebrow">Playoffs</p><h1>Payout Pot</h1></div>`;
  if (d.availablePayoutPot){
    playoffCard += `<div class="pot-box">
      <div class="pot-row"><span class="k">Anticipated pot</span><span class="v">${fmtMoney(d.availablePayoutPot.anticipated)}</span></div>
      <div class="pot-row"><span class="k">Actual pot</span><span class="v">${fmtMoney(d.availablePayoutPot.actual)}</span></div>
      <div class="pot-note">League Dues − High Score Payouts − League Activation Fee</div>
    </div>`;

  d.playoffPayout.forEach(p => {

      <div class="rname"><span class="n">${p.place} Place${pctLabel}</span><span class="t"> · ${p.winner||'TBD'}</span></div>
      <span class="rsal">${fmtMoney(p.actual)}</span>
      ${isCommish ? `<button class="paid-toggle ${p.paid?'yes':'no'}" data-toggle-place="${p.place}" data-paid="${p.paid}">${p.paid?'Paid':'Unpaid'}</button>` : `<span class="paid-pill ${p.paid?'yes':'no'}">${p.paid?'Paid':'Unpaid'}</span>`}

function attachDuesHandlers(){

function emptyBracket(){
  return {
    seeds: {1:'',2:'',3:'',4:'',5:'',6:''},
    round1: { a: {score1:null,score2:null,winner:null}, b: {score1:null,score2:null,winner:null} },
    round2: { a: {team1:'',team2:'',score1:null,score2:null,winner:null}, b: {team1:'',team2:'',score1:null,score2:null,winner:null} },
    championship: {team1:'',team2:'',score1:null,score2:null,winner:null},
    thirdPlace: {team1:'',team2:'',score1:null,score2:null,winner:null},

}
function bracketTeamName(b, seedNum){ return (b.seeds && b.seeds[seedNum]) || `Seed ${seedNum}`; }

  else html += state.ui.bracketEditMode ? renderBracketEdit() : renderBracketReadOnly();

function renderStandingsSnapshots(){
  const s = state.data.standings;
  if (!s) return `<div class="card"><div class="placeholder">Loading…</div></div>`;
  let regCard = `<div class="card"><div class="card-head"><p class="eyebrow">Snapshot — End of Week 14</p><h1>Regular Season</h1></div>`;
  if (s.regularSeason.length === 0){
    regCard += `<div class="placeholder">Not filled in yet — check back after Week 14.</div>`;
  } else {
    regCard += `<table class="standings"><thead><tr><th></th><th>Team</th><th>Record</th><th>PF</th><th>PA</th></tr></thead><tbody>`;
    s.regularSeason.forEach(r => { regCard += `<tr><td class="place">${r.place}</td><td class="team">${r.team}</td><td>${r.record||'—'}</td><td class="num">${r.pointsFor??'—'}</td><td class="num">${r.pointsAgainst??'—'}</td></tr>`; });
    regCard += `</tbody></table>`;
  }
  regCard += `</div>`;

  let finalCard = `<div class="card"><div class="card-head"><p class="eyebrow">Snapshot — After Playoffs</p><h1>Final Standings</h1></div>`;
  if (s.finalStandings.length === 0){
    finalCard += `<div class="placeholder">Not filled in yet — check back once playoffs conclude.</div>`;
  } else {
    finalCard += `<table class="standings"><tbody>`;
    s.finalStandings.forEach(f => { finalCard += `<tr class="${f.place===1?'champ':''}"><td class="place">${f.place}</td><td class="team">${f.team}</td></tr>`; });

  finalCard += `<div class="card-foot"><span>SOURCE: EOY Standings</span><button class="refresh" id="refreshBtn">↻ Refresh</button></div></div>`;

  return `<div class="standings-desktop-pair">${regCard}${finalCard}</div>`;
}

function matchupHtml(team1, team2, g, celebrate){
  const decided = g.winner !== null && g.winner !== undefined;
  const w1 = decided && g.winner === 1;
  const w2 = decided && g.winner === 2;
  const cls = celebrate ? ' celebrate' : '';
  const trophyIcon = celebrate ? '🏆' : '✓';
  return `
    <div class="matchup${decided?' decided':''}${cls}">
      <div class="mteam${w1?' winner':''}"><span class="tname">${team1||'TBD'}</span><span class="tscore">${g.score1??'—'}</span>${w1?'<span class="trophy">'+trophyIcon+'</span>':''}</div>
      <div class="mdivider"></div>
      <div class="mteam${w2?' winner':''}"><span class="tname">${team2||'TBD'}</span><span class="tscore">${g.score2??'—'}</span>${w2?'<span class="trophy">'+trophyIcon+'</span>':''}</div>
    </div>`;
}

function renderBracketEdit(){
  if (!state.ui.bracketDraft) state.ui.bracketDraft = state.data.bracket && state.data.bracket.seeds ? JSON.parse(JSON.stringify(state.data.bracket)) : emptyBracket();
  const draft = state.ui.bracketDraft;
  const teams = state.data.salaryCap.teams.map(t => t.team);

  function seedSelect(n){
    return `<div><label>Seed ${n}</label><select class="plain" style="margin:0;width:100%;" data-seed="${n}">
      <option value="">— select —</option>
      ${teams.map(t => `<option value="${t}" ${draft.seeds[n]===t?'selected':''}>${t}</option>`).join('')}
    </select></div>`;
  }
  function editGameFixed(path, team1Label, team2Label, g){
    return `<div class="edit-matchup" data-game="${path}">
      <div class="edit-row"><span class="tname">${team1Label}</span><input type="number" data-score="1" value="${g.score1??''}" placeholder="0"><input type="radio" class="winner-check" name="w-${path}" data-winner="1" ${g.winner===1?'checked':''}></div>
      <div class="edit-row"><span class="tname">${team2Label}</span><input type="number" data-score="2" value="${g.score2??''}" placeholder="0"><input type="radio" class="winner-check" name="w-${path}" data-winner="2" ${g.winner===2?'checked':''}></div>
    </div>`;
  }
  function editGameFree(path, g){
    const opt = (val) => `<option value="">— pick team —</option>` + teams.map(t => `<option value="${t}" ${g[val]===t?'selected':''}>${t}</option>`).join('');
    return `<div class="edit-matchup" data-game="${path}">
      <div class="edit-row"><select class="plain" data-team="1" style="flex:1;margin:0;">${opt('team1')}</select><input type="number" data-score="1" value="${g.score1??''}" placeholder="0"><input type="radio" class="winner-check" name="w-${path}" data-winner="1" ${g.winner===1?'checked':''}></div>
      <div class="edit-row"><select class="plain" data-team="2" style="flex:1;margin:0;">${opt('team2')}</select><input type="number" data-score="2" value="${g.score2??''}" placeholder="0"><input type="radio" class="winner-check" name="w-${path}" data-winner="2" ${g.winner===2?'checked':''}></div>
    </div>`;
  }

  return `<div class="card">
    <div class="card-head"><p class="eyebrow">Commissioner Edit Mode</p><h1>Bracket</h1><p class="subtext">Round 1 is fixed by seeding. From Round 2 on, pick the actual matchups CBS shows each week.</p></div>
    <div class="seed-grid">${[1,2,3,4,5,6].map(seedSelect).join('')}</div>
    <div class="round-label">Round 1 — Week 15</div>
    ${editGameFixed('r1a', draft.seeds[3]||'Seed 3', draft.seeds[6]||'Seed 6', draft.round1.a)}
    ${editGameFixed('r1b', draft.seeds[4]||'Seed 4', draft.seeds[5]||'Seed 5', draft.round1.b)}
    <div class="round-label">Round 2 — Week 16</div>
    ${editGameFree('r2a', draft.round2.a)}
    ${editGameFree('r2b', draft.round2.b)}
    <div class="round-label">Championship — Week 17</div>
    ${editGameFree('champ', draft.championship)}
    <div class="round-label">Third Place Game — Week 17</div>
    ${editGameFree('third', draft.thirdPlace)}
    <button class="primary-btn margined" id="saveBracketBtn">Save Bracket</button>
    <div id="bracketErrBox"></div>
  </div>`;
}

function pathToGame(path){
  const d = state.ui.bracketDraft;
  if (path === 'r1a') return d.round1.a;
  if (path === 'r1b') return d.round1.b;
  if (path === 'r2a') return d.round2.a;
  if (path === 'r2b') return d.round2.b;
  if (path === 'champ') return d.championship;
  if (path === 'third') return d.thirdPlace;
}

async function saveBracket(){
  const btn = document.getElementById('saveBracketBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await post({ action:'savebracket', pin: state.ui.commissioner.pin, bracketData: state.ui.bracketDraft });
    state.data.bracket = JSON.parse(JSON.stringify(state.ui.bracketDraft));
    state.ui.bracketEditMode = false;
    render();
  } catch (err) {
    document.getElementById('bracketErrBox').innerHTML = `<div class="err-box"><b>Save failed:</b> ${err.message}</div>`;
    btn.disabled = false; btn.textContent = 'Save Bracket';
  }
}

function attachStandingsHandlers(){
  document.querySelectorAll('[data-sview]').forEach(btn => {
    btn.addEventListener('click', () => { state.ui.standingsView = btn.getAttribute('data-sview'); state.ui.bracketEditMode = false; render(); });
  });
  const editToggle = document.getElementById('bracketEditToggle');
  if (editToggle) editToggle.addEventListener('click', () => { state.ui.bracketEditMode = true; state.ui.bracketDraft = null; render(); });

  document.querySelectorAll('[data-seed]').forEach(sel => {
    sel.addEventListener('change', () => { state.ui.bracketDraft.seeds[sel.getAttribute('data-seed')] = sel.value; render(); });
  });
  document.querySelectorAll('[data-game]').forEach(box => {
    const path = box.getAttribute('data-game');
    const g = pathToGame(path);
    box.querySelectorAll('[data-score]').forEach(inp => {
      inp.addEventListener('input', () => { g['score' + inp.getAttribute('data-score')] = inp.value === '' ? null : Number(inp.value); });
    });
    box.querySelectorAll('[data-team]').forEach(sel => {
      sel.addEventListener('change', () => { g['team' + sel.getAttribute('data-team')] = sel.value; });
    });
    box.querySelectorAll('[data-winner]').forEach(radio => {
      radio.addEventListener('change', () => { g.winner = Number(radio.getAttribute('data-winner')); render(); });
    });
  });
  const saveBtn = document.getElementById('saveBracketBtn');
  if (saveBtn) saveBtn.addEventListener('click', saveBracket);
  const rb = document.getElementById('refreshBtn');
  if (rb) rb.addEventListener('click', () => refreshAll(false));
}

function renderCommish(){
  if (!state.ui.commissioner){
    return `<div class="card"><div class="card-head"><p class="eyebrow">Commissioner Only</p><h1>Unlock Tools</h1><p class="subtext">Use the 🛠️ pill above to unlock with your commissioner PIN — it applies across Dues, Standings/Bracket, and this checklist.</p></div></div>`;
  }

  const exempt = state.data.exemptSelections.selections;
  const checklist = state.data.checklist.checklist;
  const ds = deadlineState();
  const deadlinePassed = ds.state === 'closed';
  const doneByTeam = {}; checklist.forEach(c => { if (c.done) doneByTeam[c.team] = c; });

  const byTeam = {}; exempt.forEach(s => byTeam[s.team] = s);
  const allTeams = (state.data.salaryCap?.teams||[]).map(t=>t.team);
  let submitted=0, missed=0;
  const checklistRows = allTeams.map(team => {
    const sel = byTeam[team]; const sub = !!sel;
    if (sub) submitted++; else if (deadlinePassed) missed++;
    return { team, sel };
  }).sort((a,b) => { const as=!!a.sel,bs=!!b.sel; if(as!==bs) return as?1:-1; return a.team.localeCompare(b.team); });

  const checklistHtml = checklistRows.map(r => {
    const sub = !!r.sel;
    return `<div class="row">
      <span style="width:9px;height:9px;border-radius:50%;flex:none;background:${sub?'var(--good)':'var(--over)'};"></span>
      <div class="rname"><span class="n">${r.team}</span><div class="t">${sub ? 'Selected: '+r.sel.player : (deadlinePassed?'No selection — forfeited':'Awaiting submission')}</div></div>
      <span class="tag" style="${sub?'background:rgba(63,125,84,.15);color:var(--good);':'background:rgba(179,64,47,.12);color:var(--over);'}">${sub?'Submitted':(deadlinePassed?'Missed':'Pending')}</span>
    </div>`;
  }).join('');

  const relevant = deadlinePassed ? exempt : [];
  const pending = relevant.filter(s => !doneByTeam[s.team]);
  const done = relevant.filter(s => doneByTeam[s.team]);

  let queueHtml;
  if (!deadlinePassed){
    queueHtml = `<div class="placeholder">The exempt deadline hasn't passed yet.</div>`;
  } else if (relevant.length === 0){
    queueHtml = `<div class="all-clear"><div class="big">✓</div>No exempt selections were submitted this season.</div>`;
  } else {
    let h = '';
    if (pending.length){
      h += pending.map(s => `<div class="row">
        <div class="rname"><span class="n">${s.team}</span><div class="t">Exempt: <b>${s.player}</b></div></div>
        <button class="refresh" data-mark="${s.team}" style="border-color:var(--good);color:var(--good);">Mark Done</button>
      </div>`).join('');
    } else {
      h += `<div class="all-clear"><div class="big">✓</div>All caught up.</div>`;
    }
    if (done.length){
      h += `<p class="eyebrow" style="padding:14px 22px 0;">Completed</p>`;
      h += done.map(s => `<div class="row" style="opacity:.65;">
        <span style="color:var(--good);">✓</span>
        <div class="rname"><span class="n" style="text-decoration:line-through;">${s.team}</span> — ${s.player}</div>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-soft);">by ${doneByTeam[s.team].completedBy||'—'}</span>
      </div>`).join('');
    }
    queueHtml = h;
  }

  return `
    <div class="commish-desktop-split">
      <div class="card">
        <div class="card-head"><p class="eyebrow">Commissioner</p><h1>Exempt Checklist</h1></div>
        <div class="summary-row">
          <div class="summary-chip submitted"><div class="num">${submitted}</div><div class="lbl">Submitted</div></div>
          <div class="summary-chip pending"><div class="num">${allTeams.length-submitted-missed}</div><div class="lbl">Not Yet</div></div>
          <div class="summary-chip missed"><div class="num">${missed}</div><div class="lbl">Missed</div></div>
        </div>
        <div class="deadline-banner ${ds.state}">${ds.state==='closed'?'Deadline passed':ds.label}</div>
        <div class="list">${checklistHtml}</div>
      </div>
      <div class="card">
        <div class="card-head"><p class="eyebrow">Commissioner</p><h1>CBS Update Queue</h1><p class="subtext">Locked-in picks still needing the manual $0 update in CBS.</p></div>
        <div class="list">${queueHtml}</div>
        <div id="cbsErrBox"></div>
        <div class="card-foot"><span>SOURCE: ExemptSelections · Checklist</span><button class="refresh" id="refreshBtn">↻ Refresh</button></div>
      </div>
    </div>`;
}

function attachCommishHandlers(){
  document.querySelectorAll('[data-mark]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const targetTeam = btn.getAttribute('data-mark');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await post({ action:'markChecklistDone', pin: state.ui.commissioner.pin, targetTeam });
        state.data.checklist = await get('checklist');
        render();
      } catch (err) {
        document.getElementById('cbsErrBox').innerHTML = `<div class="err-box"><b>Could not mark complete:</b> ${err.message}</div>`;
        btn.disabled = false; btn.textContent = 'Mark Done';
      }
    });
  });
  const rb = document.getElementById('refreshBtn');
  if (rb) rb.addEventListener('click', () => refreshAll(false));
}

document.getElementById('commishToggleBtn').innerHTML = ICONS.commish;
render();
refreshAll(true);
setInterval(() => refreshAll(false), POLL_MS);
</script>
</body>
</html>
